<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MyPatterns</title>
  <meta name="theme-color" content="#8a4f7d">
  <meta name="description" content="שמירה ומעקב אחרי דוגמאות סריגה, מסונכרן לגוגל דרייב">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <!-- ===== מסך הגדרה ראשונית ===== -->
  <section id="setupView" class="screen hidden">
    <div class="setup-card">
      <div class="lang-slot"></div>
      <div class="logo"><img src="icons/icon.svg" alt="MyPatterns" width="96" height="96"></div>
      <h1>MyPatterns</h1>
      <p class="muted" data-i18n="setupText"></p>
      <label class="field">
        <span>Google OAuth Client ID</span>
        <input id="clientIdInput" type="text" dir="ltr" placeholder="123456789012-xxxx.apps.googleusercontent.com" autocomplete="off">
      </label>
      <label class="field">
        <span data-i18n="apiKeyLabel"></span>
        <input id="apiKeyInput" type="text" dir="ltr" placeholder="AIza…" autocomplete="off">
      </label>
      <button id="saveClientIdBtn" class="btn primary wide" data-i18n="saveContinue"></button>
      <div class="or" data-i18n="or"></div>
      <button class="btn wide open-local-btn" data-i18n="openLocalNoDrive"></button>
    </div>
  </section>

  <!-- ===== מסך התחברות ===== -->
  <section id="loginView" class="screen hidden">
    <div class="setup-card">
      <div class="lang-slot"></div>
      <div class="logo"><img src="icons/icon.svg" alt="MyPatterns" width="96" height="96"></div>
      <h1>MyPatterns</h1>
      <p class="muted" data-i18n="loginText"></p>
      <button id="loginBtn" class="btn primary wide" data-i18n="loginBtn"></button>
      <div class="or" data-i18n="or"></div>
      <button class="btn wide open-local-btn" data-i18n="openLocal"></button>
      <button id="resetClientBtn" class="btn link" data-i18n="changeClientId"></button>
    </div>
  </section>

  <!-- ===== דשבורד ===== -->
  <section id="dashView" class="screen hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden back-arrow" data-i18n-title="back">→</button>
      <h1 id="dashTitle">MyPatterns</h1>
      <div class="spacer"></div>
      <button id="refreshBtn" class="icon-btn" data-i18n-title="refresh">⟳</button>
      <button id="addBtn" class="icon-btn" data-i18n-title="add">＋</button>
      <button id="settingsBtn" class="icon-btn" data-i18n-title="settings">⚙</button>
    </header>
    <nav id="crumbs" class="crumbs"></nav>
    <div class="search-row">
      <input id="searchInput" type="search" data-i18n-ph="searchPh">
    </div>
    <div id="offlineNote" class="note hidden" data-i18n="offline"></div>
    <div id="authNote" class="note hidden"><span data-i18n="authExpired"></span> <button id="reauthBtn" class="btn small primary" data-i18n="reauth"></button></div>
    <section id="recentSection" class="hidden">
      <h2 class="section-title" data-i18n="continueKnitting"></h2>
      <div id="recentRow" class="recent-row"></div>
    </section>
    <div id="grid" class="grid"></div>
    <div id="grantRow" class="grant-row hidden"><button class="btn link grant-btn" data-i18n="grantMissing"></button></div>
    <div id="emptyNote" class="empty hidden">
      <div class="logo">🧶</div>
      <p id="emptyText" data-i18n="emptyText"></p>
      <p class="muted small-note" data-i18n="emptyHelp"></p>
      <div class="empty-actions">
        <button class="btn primary grant-btn" data-i18n="grantBtn"></button>
        <button class="btn upload-btn" data-i18n="uploadNew"></button>
      </div>
    </div>
    <div id="welcome" class="empty hidden">
      <div class="logo"><img src="icons/icon.svg" alt="MyPatterns" width="96" height="96"></div>
      <h2 data-i18n="welcome"></h2>
      <p class="muted small-note" data-i18n="welcomeHelp"></p>
      <div class="empty-actions">
        <button id="pickExistingBtn" class="btn primary" data-i18n="pickExisting"></button>
        <button id="createRootBtn" class="btn" data-i18n="createRoot"></button>
      </div>
    </div>
  </section>

  <!-- ===== מציג דוגמה ===== -->
  <section id="viewerView" class="screen hidden">
    <header class="topbar viewer-top">
      <button id="closeViewerBtn" class="icon-btn back-arrow" data-i18n-title="back">→</button>
      <h1 id="viewerTitle" class="ellipsis"></h1>
      <div class="spacer"></div>
      <span id="syncBadge" class="sync-badge" data-i18n-title="syncStatus"></span>
      <button id="extBtn" class="btn small hidden" data-i18n="openInBrowser"></button>
      <button id="accurateBtn" class="btn small hidden" data-i18n-title="accurateTitle" data-i18n="accurate"></button>
    </header>
    <div id="stage" class="stage">
      <div id="scroller" class="scroller">
        <div id="content" class="content"></div>
      </div>
      <div id="dimLayer" class="dim-layer hidden"></div>
      <div id="hRuler" class="ruler h" data-i18n-title="hRuler">
        <div class="band"></div>
        <div class="grip">⇕</div>
      </div>
      <div id="vRuler" class="ruler v" data-i18n-title="vRuler">
        <div class="band"></div>
        <div class="grip">⇔</div>
      </div>
      <div id="viewerLoading" class="viewer-loading hidden"><div class="spinner"></div><span data-i18n="loading"></span></div>
    </div>

    <!-- פאנל הגדרות סרגלים -->
    <div id="rulerPanel" class="ruler-panel hidden">
      <div class="panel-head">
        <b data-i18n="rulerSettings"></b>
        <button id="panelClose" class="btn small primary" data-i18n="done"></button>
      </div>
      <div class="panel-grid">
        <div class="panel-col">
          <h3 data-i18n="hRulerRows"></h3>
          <label class="row-field"><span data-i18n="thickness"></span>
            <input id="hThick" type="range" min="3" max="250" step="1"><output id="hThickOut"></output></label>
          <label class="row-field"><span data-i18n="color"></span><input id="hColor" type="color"></label>
        </div>
        <div class="panel-col">
          <h3 data-i18n="vRulerCols"></h3>
          <label class="row-field"><span data-i18n="thickness"></span>
            <input id="vThick" type="range" min="3" max="250" step="1"><output id="vThickOut"></output></label>
          <label class="row-field"><span data-i18n="color"></span><input id="vColor" type="color"></label>
        </div>
        <div class="panel-col">
          <h3 data-i18n="general"></h3>
          <label class="row-field"><span data-i18n="opacity"></span>
            <input id="opacity" type="range" min="0.08" max="0.8" step="0.02"><output id="opacityOut"></output></label>
          <label class="row-field check"><input id="dimToggle" type="checkbox"><span data-i18n="dimRest"></span></label>
          <label class="row-field check"><input id="lockToggle" type="checkbox"><span data-i18n="lockPattern"></span></label>
        </div>
      </div>
    </div>

    <footer class="viewer-bar">
      <div class="bar-group">
        <button id="hToggle" class="tool on" data-i18n-title="hRuler">▬</button>
        <button id="hUp" class="tool" data-i18n-title="hUp">▲</button>
        <button id="hDown" class="tool" data-i18n-title="hDown">▼</button>
      </div>
      <div class="bar-group">
        <button id="vToggle" class="tool on" data-i18n-title="vRuler">▮</button>
        <button id="vRight" class="tool" data-i18n-title="vRight">▶</button>
        <button id="vLeft" class="tool" data-i18n-title="vLeft">◀</button>
      </div>
      <div class="bar-group counter" data-i18n-title="rowCounter">
        <button id="cMinus" class="tool">−</button>
        <button id="cValue" class="counter-val" data-i18n-title="clickToSet">0</button>
        <button id="cPlus" class="tool">+</button>
      </div>
      <div class="bar-group">
        <button id="zoomOut" class="tool" data-i18n-title="zoomOut">−🔍</button>
        <button id="zoomFit" class="tool" data-i18n-title="zoomFit">⤢</button>
        <button id="zoomIn" class="tool" data-i18n-title="zoomIn">+🔍</button>
      </div>
      <div class="bar-group">
        <button id="panelToggle" class="tool" data-i18n-title="rulerSettings">🎨</button>
      </div>
    </footer>
  </section>

  <!-- ===== חלונות ===== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn" data-i18n-title="close">✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFoot" class="modal-foot"></footer>
    </div>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText" data-i18n="wait"></span></div>

  <input id="imageInput" type="file" accept="image/*" hidden>
  <input id="uploadInput" type="file" multiple hidden>
  <input id="localInput" type="file" accept=".pdf,.docx,image/*,application/pdf" hidden>

  <script src="config.js?v=10"></script>
  <script src="i18n.js?v=10"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/mammoth.browser.min.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js?v=10"></script>
</body>
</html>
